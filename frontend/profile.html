<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Profile — SmartCart</title>
  <meta name="description" content="View and update your SmartCart personal profile details." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-left">
        <a href="index.html" class="brand-logo" aria-label="SmartCart Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>SmartCart</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="support.html" class="nav-link">Support</a></li>
          </ul>
        </nav>
      </div>

      <div class="nav-center">
        <form class="nav-search" action="products.html" method="GET">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" name="search" placeholder="Search catalog..." aria-label="Search items" />
        </form>
      </div>

      <div class="nav-right">
        <a href="cart.html" class="cart-btn" aria-label="Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </a>

        <div id="nav-auth-container">
          <a href="login.html" class="btn btn-primary btn-sm">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Profile Content -->
  <main class="container" style="padding-top: 40px; padding-bottom: 64px; max-width: 680px;">
    <h1 style="margin-bottom: 8px;">Account Profile</h1>
    <p style="margin-bottom: 32px;">Personal details, contact address, and membership security.</p>

    <div class="card" style="padding: 32px;" id="profile-card">
      <div id="profile-details-view">
        <!-- Rendered by inline script -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 SmartCart Inc. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { AuthStorage, showToast } from './js/api.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthStorage.getUser();
      const container = document.getElementById('profile-details-view');

      if (!user) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>Please Sign In</h3>
            <p>You must be signed in to view and edit your profile settings.</p>
            <a href="login.html" class="btn btn-primary">Sign In</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div style="display:flex; align-items:center; gap:20px; margin-bottom:28px;">
          <div style="width:64px; height:64px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.5rem;">
            ${(user.FULL_NAME || 'U')[0]}
          </div>
          <div>
            <h3 style="margin-bottom:4px;">${user.FULL_NAME}</h3>
            <p class="text-sm text-muted">${user.EMAIL}</p>
            <span class="badge ${user.ROLE === 'admin' ? 'badge-warning' : 'badge-success'}" style="margin-top:4px;">
              ${user.ROLE.toUpperCase()}
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" value="${user.FULL_NAME || ''}" id="prof-name" />
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" value="${user.EMAIL || ''}" disabled />
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" value="${user.PHONE || ''}" id="prof-phone" />
        </div>

        <div class="form-group">
          <label class="form-label">Default Shipping Address</label>
          <input type="text" class="form-control" value="${user.ADDRESS || ''}" id="prof-address" />
        </div>

        <button type="button" id="btn-save-profile" class="btn btn-primary" style="margin-top:12px;">
          Save Profile Changes
        </button>
      `;

      document.getElementById('btn-save-profile')?.addEventListener('click', () => {
        user.FULL_NAME = document.getElementById('prof-name').value;
        user.PHONE = document.getElementById('prof-phone').value;
        user.ADDRESS = document.getElementById('prof-address').value;
        AuthStorage.setUser(user);
        showToast('Profile information updated successfully.', 'success');
      });
    });
  </script>
</body>
</html>
