<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — SmartCart</title>
  <meta name="description" content="Secure checkout for your SmartCart order." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-left">
        <a href="index.html" class="brand-logo" aria-label="SmartCart Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>SmartCart</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="support.html" class="nav-link">Support</a></li>
          </ul>
        </nav>
      </div>

      <div class="nav-center">
        <form class="nav-search" action="products.html" method="GET">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" name="search" placeholder="Search catalog..." aria-label="Search items" />
        </form>
      </div>

      <div class="nav-right">
        <a href="cart.html" class="cart-btn" aria-label="Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </a>

        <div id="nav-auth-container">
          <a href="login.html" class="btn btn-primary btn-sm">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Checkout View -->
  <main class="container" style="padding-top: 40px; padding-bottom: 64px; max-width: 800px;">
    <h1 style="margin-bottom: 8px;">Order Checkout</h1>
    <p style="margin-bottom: 32px;">Shipping destination and payment authorization.</p>

    <div class="card" style="padding: 32px;">
      <h3 style="margin-bottom: 20px;">1. Shipping Information</h3>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="co-name" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="co-email" placeholder="john.doe@example.com" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Delivery Street Address</label>
        <input type="text" class="form-control" id="co-address" placeholder="742 Evergreen Terrace, Springfield" />
      </div>

      <h3 style="margin: 28px 0 20px;">2. Payment Method</h3>
      <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px;">
        <label class="card" style="padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <input type="radio" name="payment" value="card" checked />
          <div>
            <strong>Credit / Debit Card</strong>
            <p class="text-xs text-muted">Visa, Mastercard, American Express</p>
          </div>
        </label>
        <label class="card" style="padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <input type="radio" name="payment" value="cod" />
          <div>
            <strong>Cash on Delivery</strong>
            <p class="text-xs text-muted">Pay securely upon delivery arrival</p>
          </div>
        </label>
      </div>

      <button type="button" id="btn-place-order" class="btn btn-primary btn-block btn-lg">
        Place Order &rarr;
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 SmartCart Inc. All rights reserved.</div>
        <div><a href="support.html">Contact Support</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { showToast, AuthStorage } from './js/api.js';
    import { CartManager } from './js/cart.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthStorage.getUser();
      if (user) {
        document.getElementById('co-name').value = user.FULL_NAME || '';
        document.getElementById('co-email').value = user.EMAIL || '';
        document.getElementById('co-address').value = user.ADDRESS || '';
      }

      document.getElementById('btn-place-order')?.addEventListener('click', () => {
        showToast('Your order has been recorded! Thank you for choosing SmartCart.', 'success');
        CartManager.saveItems([]);
        setTimeout(() => {
          window.location.href = 'orders.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
