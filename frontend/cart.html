<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — SmartCart</title>
  <meta name="description" content="View items in your SmartCart bag and proceed to checkout." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-left">
        <a href="index.html" class="brand-logo" aria-label="SmartCart Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>SmartCart</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="support.html" class="nav-link">Support</a></li>
          </ul>
        </nav>
      </div>

      <div class="nav-center">
        <form class="nav-search" action="products.html" method="GET">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" name="search" placeholder="Search catalog..." aria-label="Search items" />
        </form>
      </div>

      <div class="nav-right">
        <a href="cart.html" class="cart-btn" aria-label="Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </a>

        <div id="nav-auth-container">
          <a href="login.html" class="btn btn-primary btn-sm">Sign In</a>
        </div>

        <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle Navigation Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-nav" class="mobile-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Products Catalog</a>
      <a href="support.html" class="nav-link">Support</a>
      <a href="cart.html" class="nav-link active">Cart</a>
    </div>
  </header>

  <!-- Main Cart Content -->
  <main class="container" style="padding-top: 40px; padding-bottom: 64px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 24px; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 style="margin-bottom: 4px;">Shopping Cart</h1>
        <p class="text-muted">Review your selected items before proceeding to checkout.</p>
      </div>
      <a href="products.html" class="btn btn-outline btn-sm">&larr; Continue Shopping</a>
    </div>

    <div id="cart-content-view">
      <div style="text-align:center; padding: 48px 0;">
        <span class="spinner" style="border-top-color: var(--primary); width:32px; height:32px;"></span>
        <p style="margin-top: 12px;">Loading shopping cart...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 SmartCart Inc. All rights reserved.</div>
        <div><a href="products.html">Continue Shopping</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { AuthStorage, escapeHtml } from './js/api.js';
    import { CartManager } from './js/cart.js';

    async function initCartPage() {
      const container = document.getElementById('cart-content-view');
      if (!container) return;

      // 1. Redirect to login if user is not authenticated
      if (!AuthStorage.isAuthenticated()) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <h3>Sign in to view your cart</h3>
            <p>You need to be logged in to access and manage your shopping cart.</p>
            <a href="login.html?redirect=cart.html" class="btn btn-primary">Sign In</a>
          </div>
        `;
        window.location.href = 'login.html?redirect=cart.html';
        return;
      }

      // 2. Render cart state
      const render = (cart) => {
        const items = cart.items || [];

        if (items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
              </svg>
              <h3>Your cart is empty</h3>
              <p>You haven't added any products to your bag yet.</p>
              <a href="products.html" class="btn btn-primary">Start Shopping</a>
            </div>
          `;
          return;
        }

        const subtotal = Number(cart.subtotal) || 0;
        const shipping = subtotal > 150 ? 0 : 9.99;
        const total = subtotal + shipping;

        container.innerHTML = `
          <div style="display:grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 32px; align-items: start;">
            <!-- Cart Items List -->
            <div class="card" style="padding: 24px;">
              <h3 style="margin-bottom: 20px; font-size:1.125rem;">Items (${cart.totalItems})</h3>
              <div style="display:flex; flex-direction:column; gap:20px;">
                ${items.map(item => `
                  <div class="cart-item-row" data-cart-id="${item.CART_ID}" style="display:flex; gap:16px; align-items:center; padding-bottom:20px; border-bottom:1px solid var(--border); flex-wrap:wrap;">
                    <a href="product-details.html?id=${item.PRODUCT_ID}">
                      <img src="${escapeHtml(item.IMAGE_URL)}" alt="${escapeHtml(item.PRODUCT_NAME)}" style="width:84px; height:84px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--border);" />
                    </a>

                    <div style="flex:1; min-width:200px;">
                      <h4 style="font-size:1rem; margin-bottom:4px;">
                        <a href="product-details.html?id=${item.PRODUCT_ID}" style="color:var(--text); font-weight:600;">
                          ${escapeHtml(item.PRODUCT_NAME)}
                        </a>
                      </h4>
                      <div class="text-xs text-muted" style="margin-bottom:8px;">
                        Unit Price: $${Number(item.PRICE).toFixed(2)}
                        ${item.CATEGORY_NAME ? ` &bull; ${escapeHtml(item.CATEGORY_NAME)}` : ''}
                      </div>

                      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                        <!-- Quantity +/- controls -->
                        <div class="quantity-picker" style="height:34px;">
                          <button type="button" class="qty-btn btn-cart-dec" data-id="${item.CART_ID}" data-qty="${item.QUANTITY}" aria-label="Decrease quantity">&minus;</button>
                          <input type="number" class="qty-input" value="${item.QUANTITY}" readonly />
                          <button type="button" class="qty-btn btn-cart-inc" data-id="${item.CART_ID}" data-qty="${item.QUANTITY}" aria-label="Increase quantity">&plus;</button>
                        </div>

                        <!-- Remove Button -->
                        <button type="button" class="btn btn-outline btn-sm btn-cart-remove" data-id="${item.CART_ID}" style="height:34px; padding:0 12px; color:var(--danger); border-color:var(--border);">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                          </svg>
                          <span>Remove</span>
                        </button>
                      </div>
                    </div>

                    <!-- Line Total -->
                    <div style="text-align:right; min-width:90px;">
                      <div class="text-xs text-muted">Subtotal</div>
                      <div style="font-weight:700; font-size:1.125rem; color:var(--text); margin-top:2px;">
                        $${Number(item.SUBTOTAL).toFixed(2)}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Order Summary Card -->
            <div class="card" style="padding: 24px; position:sticky; top:88px;">
              <h3 style="margin-bottom: 20px; font-size:1.125rem;">Order Summary</h3>
              
              <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.875rem;">
                <span class="text-muted">Subtotal (${cart.totalItems} items)</span>
                <span class="font-semibold" id="cart-summary-subtotal">$${subtotal.toFixed(2)}</span>
              </div>

              <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.875rem;">
                <span class="text-muted">Standard Courier Delivery</span>
                <span class="font-semibold" id="cart-summary-shipping" style="${shipping === 0 ? 'color:var(--success);' : ''}">
                  ${shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2)}
                </span>
              </div>

              ${shipping > 0 ? `
                <div class="text-xs" style="color:var(--muted); margin-bottom:12px; background:var(--bg); padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                  Add <strong>$${(150 - subtotal).toFixed(2)}</strong> more to qualify for <strong>FREE shipping</strong>.
                </div>
              ` : `
                <div class="text-xs" style="color:var(--success); margin-bottom:12px; background:var(--success-light); padding:8px 12px; border-radius:var(--radius-sm); border:1px solid #BBF7D0;">
                  &check; You've unlocked free express courier dispatch!
                </div>
              `}

              <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px; display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-size:1rem; font-weight:600;">Total</span>
                <span style="font-size:1.375rem; font-weight:700; color:var(--text);" id="cart-summary-total">$${total.toFixed(2)}</span>
              </div>

              <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="margin-top:24px;">
                <span>Proceed to Checkout</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px;">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>

              <div style="margin-top:16px; text-align:center;">
                <span class="text-xs text-muted">&bull; 30-Day Money-back Guarantee &bull;</span>
              </div>
            </div>
          </div>
        `;

        // Bind Dec Buttons
        container.querySelectorAll('.btn-cart-dec').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.dataset.id);
            const currentQty = Number(btn.dataset.qty);
            btn.disabled = true;
            try {
              if (currentQty > 1) {
                await CartManager.updateQuantity(id, currentQty - 1);
              } else {
                await CartManager.removeItem(id);
              }
            } finally {
              btn.disabled = false;
            }
          });
        });

        // Bind Inc Buttons
        container.querySelectorAll('.btn-cart-inc').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.dataset.id);
            const currentQty = Number(btn.dataset.qty);
            btn.disabled = true;
            try {
              await CartManager.updateQuantity(id, currentQty + 1);
            } finally {
              btn.disabled = false;
            }
          });
        });

        // Bind Remove Buttons
        container.querySelectorAll('.btn-cart-remove').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.dataset.id);
            btn.disabled = true;
            try {
              await CartManager.removeItem(id);
            } finally {
              btn.disabled = false;
            }
          });
        });
      };

      // Subscribe to live cart changes
      CartManager.subscribe(render);

      // Initial fetch
      try {
        const cart = await CartManager.fetchCart();
        render(cart);
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">Error loading cart. Please try again.</p></div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initCartPage);
  </script>
</body>
</html>
