<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — SmartCart</title>
  <meta name="description" content="View items in your SmartCart bag and proceed to checkout." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sticky Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-left">
        <a href="index.html" class="brand-logo" aria-label="SmartCart Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>SmartCart</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="support.html" class="nav-link">Support</a></li>
          </ul>
        </nav>
      </div>

      <div class="nav-center">
        <form class="nav-search" action="products.html" method="GET">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" name="search" placeholder="Search catalog..." aria-label="Search items" />
        </form>
      </div>

      <div class="nav-right">
        <a href="cart.html" class="cart-btn" aria-label="Shopping Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </a>

        <div id="nav-auth-container">
          <a href="login.html" class="btn btn-primary btn-sm">Sign In</a>
        </div>

        <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle Navigation Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Cart Content -->
  <main class="container" style="padding-top: 40px; padding-bottom: 64px;">
    <h1 style="margin-bottom: 8px;">Shopping Cart</h1>
    <p style="margin-bottom: 32px;">Review your selected items before proceeding to checkout.</p>

    <div id="cart-content-view">
      <!-- Injected by inline cart script -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 SmartCart Inc. All rights reserved.</div>
        <div><a href="products.html">Continue Shopping</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { CartManager } from './js/cart.js';

    function renderCartPage() {
      const container = document.getElementById('cart-content-view');
      const items = CartManager.getItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <h3>Your cart is empty</h3>
            <p>You haven't added any products to your bag yet.</p>
            <a href="products.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      const subtotal = CartManager.getSubtotal();
      const shipping = subtotal > 150 ? 0 : 9.99;
      const total = subtotal + shipping;

      container.innerHTML = `
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 32px; align-items: start;">
          <div class="card" style="padding: 24px;">
            <div style="display:flex; flex-direction:column; gap:20px;">
              ${items.map(item => `
                <div style="display:flex; gap:16px; align-items:center; padding-bottom:20px; border-bottom:1px solid var(--border);">
                  <img src="${item.IMAGE_URL}" alt="${item.PRODUCT_NAME}" style="width:72px; height:72px; object-fit:cover; border-radius:var(--radius);" />
                  <div style="flex:1;">
                    <h4 style="font-size:1rem; margin-bottom:4px;">${item.PRODUCT_NAME}</h4>
                    <div class="text-xs text-muted">Unit Price: $${Number(item.PRICE).toFixed(2)}</div>
                    <div style="font-size:0.875rem; font-weight:600; margin-top:4px;">Quantity: ${item.quantity}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-weight:700; font-size:1.125rem;">$${(item.PRICE * item.quantity).toFixed(2)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card" style="padding: 24px;">
            <h3 style="margin-bottom: 20px;">Order Summary</h3>
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.875rem;">
              <span class="text-muted">Subtotal</span>
              <span class="font-medium">$${subtotal.toFixed(2)}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.875rem;">
              <span class="text-muted">Standard Shipping</span>
              <span class="font-medium">${shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2)}</span>
            </div>
            <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px; display:flex; justify-content:space-between; font-weight:700; font-size:1.25rem;">
              <span>Total</span>
              <span>$${total.toFixed(2)}</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="margin-top:24px;">
              Proceed to Checkout &rarr;
            </a>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>
</html>
